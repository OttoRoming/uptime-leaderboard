services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: shushing_face
      POSTGRES_DB: leaderboard
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
